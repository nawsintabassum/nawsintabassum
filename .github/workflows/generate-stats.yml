name: Generate GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Profile Directory
        run: |
          mkdir -p profile

      - name: Generate GitHub Statistics Card
        run: |
          curl --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            "https://github-readme-stats.vercel.app/api?username=nawsintabassum&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true" \
            --output profile/stats.svg

      - name: Verify Statistics SVG
        run: |
          if grep -q "<svg" profile/stats.svg; then
            echo "Stats SVG generated successfully"
          else
            echo "Invalid SVG file!"
            cat profile/stats.svg
            exit 1
          fi

      - name: Generate Top Languages Card
        run: |
          curl --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=nawsintabassum&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" \
            --output profile/top-langs.svg

      - name: Verify Top Languages SVG
        run: |
          if grep -q "<svg" profile/top-langs.svg; then
            echo "Top Languages SVG generated successfully"
          else
            echo "Invalid SVG file!"
            cat profile/top-langs.svg
            exit 1
          fi

      - name: Generate Activity Graph
        run: |
          curl --location \
            --fail \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            "https://github-readme-activity-graph.vercel.app/graph?username=nawsintabassum&theme=tokyo-night&hide_border=true&area=true&radius=10" \
            --output profile/activity-graph.svg

      - name: Verify Activity Graph SVG
        run: |
          if grep -q "<svg" profile/activity-graph.svg; then
            echo "Activity Graph SVG generated successfully"
          else
            echo "Invalid SVG file!"
            cat profile/activity-graph.svg
            exit 1
          fi

      - name: Show Generated Files
        run: |
          ls -lh profile/

      - name: Commit and Push Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub profile statistics"
            git push
          fi
