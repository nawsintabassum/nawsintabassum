name: Generate Contribution Snake

on:
  schedule:
    # Automatically runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allows manual workflow run from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Snake Animation
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      # Generate the GitHub contribution snake animation
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: nawsintabassum

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push the generated snake files to the output branch
      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
